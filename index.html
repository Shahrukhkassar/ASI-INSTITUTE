here<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASI Teacher | Custom Test</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc] min-h-screen font-[Inter]">
<header class="sticky top-0 z-50 bg-white/80 backdrop-blur border-b border-slate-200 h-[64px] flex items-center">
<div class="max-w-6xl w-full mx-auto px-4 flex justify-between items-center">
<b class="text-[20px] tracking-tight">ASI INSTITUTE <span class="text-slate-500 font-medium">Teacher Portal</span></b>
<a href="index.html" class="px-4 py-1.5 rounded-full border border-[#0f172a] text-[13px]">Home</a>
</div></header>

<main class="max-w-[900px] mx-auto p-4 md:p-8 space-y-6">
<h1 class="text-[32px] font-extrabold tracking-tight">Teacher Dashboard</h1>

<!-- PDF TO LIVE TEST CARD -->
<div class="bg-white rounded-[20px] border border-slate-200 p-6 shadow">
<h2 class="text-[18px] font-bold">📄 PDF → LIVE TEST (Custom Test)</h2>
<p class="text-[13px] text-slate-500 mt-1">Upload a question PDF, review extracted questions, then publish the test.</p>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
<label class="text-[13px] font-semibold">Test title<input id="title" placeholder="SSC GD CUSTOM MOCK 01" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 outline-none focus:border-[#f97316]"></label>
<label class="text-[13px] font-semibold">Exam<select id="exam" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5"><option>SSC</option><option>Bank</option><option>Railway</option><option>NEET</option><option>JEE</option></select></label>
<label class="text-[13px] font-semibold">Subject<input id="subject" placeholder="Reasoning / Maths / GK" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5"></label>
<label class="text-[13px] font-semibold">Duration (minutes)<input id="duration" type="number" value="60" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5"></label>
</div>

<label id="drop" class="mt-4 border-2 border-dashed border-slate-200 rounded-[16px] p-6 flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-slate-50 transition">
<input id="pdf" type="file" accept="application/pdf" hidden>
<span class="bg-[#0f172a] text-white px-4 py-1.5 rounded-full text-[12px]">Choose File</span>
<span id="fname" class="text-[12px] text-slate-500">Choose Question PDF</span>
</label>

<div class="flex flex-col md:flex-row gap-3 mt-4">
<button id="btnPreview" class="flex-1 bg-slate-100 hover:bg-slate-200 py-3 rounded-xl font-bold text-[14px] transition">1. Preview / Extract Questions</button>
<button id="btnPublish" class="flex-1 bg-[#0f172a] text-white py-3 rounded-xl font-bold text-[14px] shadow-[0_10px_20px_-10px_rgba(249,115,22,0.8)]">🚀 2. Publish LIVE - Custom Test Button</button>
</div>
</div>

<div class="bg-white rounded-[20px] border border-slate-200 p-6">
<h2 class="font-bold">Question Preview</h2>
<div id="preview" class="mt-3 p-4 rounded-xl bg-slate-50 text-[13px] text-slate-500">Upload a PDF to begin.</div>
</div>

<div class="bg-white rounded-[20px] border border-slate-200 p-6">
<h2 class="font-bold">Published Tests</h2>
<div id="published" class="mt-3 space-y-2"></div>
</div>

</main>

<script>
let Qs=[],ready=false;
const $=id=>document.getElementById(id);
$('drop').onclick=()=>$('pdf').click();
$('pdf').onchange=e=>{
 if(e.target.files[0]) $('fname').textContent='✅ '+e.target.files[0].name;
}
$('btnPreview').onclick=()=>{
 if(!$('pdf').files[0]){alert('PDF select karo pehle!');return}
 Qs=[{q:'Example Q1 - Delhi capital?',options:['Mumbai','Delhi','Kolkata'],ans:1},{q:'2+2=?',options:['3','4','5'],ans:1}];
 $('preview').innerHTML=`<div class="bg-emerald-50 border border-emerald-200 text-emerald-700 p-3 rounded-xl"><b>✅ PDF Ready:</b> ${$('pdf').files[0].name}<br>2 Questions Extracted - Ready to Publish</div>`;
 ready=true;
}
$('btnPublish').onclick=()=>{
 let title=$('title').value.trim();
 if(!title){alert('Title likho! Ex: SSC GD CUSTOM MOCK 01');return}
 if(!ready){alert('Pehle Preview button dabao!');return}
 let test={id:'TEST_'+Date.now(),title:title,exam:$('exam').value,subject:$('subject').value,duration:$('duration').value,questions:Qs,createdAt:new Date().toLocaleString(),isCustom:true};
 let all=JSON.parse(localStorage.getItem('asi_published_tests')||'[]');
 all.push(test);
 localStorage.setItem('asi_published_tests',JSON.stringify(all));
 localStorage.setItem('asi_custom_tests',JSON.stringify(all));
 render();
 alert('✅ CUSTOM TEST PUBLISHED: '+title+'\nAb student.html me dikhega!');
}
function render(){
 let all=JSON.parse(localStorage.getItem('asi_published_tests')||'[]');
 let d=$('published');
 if(!all.length){d.innerHTML='<p class="text-slate-400 text-[13px]">No tests yet</p>';return}
 d.innerHTML='';
 [...all].reverse().forEach(t=>{
   d.innerHTML+=`<div class="border border-slate-200 rounded-xl p-4 flex justify-between items-center"><div><b class="text-[14px]">${t.title}</b><br><span class="text-[11px] text-slate-500">${t.exam} | ${t.subject} | ${t.createdAt}</span></div><a href="test.html?id=${t.id}" target="_blank" class="bg-[#0f172a] text-white px-3 py-1.5 rounded-full text-[11px]">View</a></div>`;
 });
} render();
</script>
</body></html>
